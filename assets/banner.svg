<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Accent Gold/Orange Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Cyber Cyan Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" opacity="0.6" />
      <circle cx="40" cy="0" r="1.5" fill="#334155" />
    </pattern>

    <!-- Glowing Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowSubtle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes pulseBeam {
        0% { stroke-dashoffset: 600; opacity: 0.2; }
        50% { opacity: 1; }
        100% { stroke-dashoffset: 0; opacity: 0.2; }
      }
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes telemetryBlink {
        0%, 100% { opacity: 0.3; r: 3; }
        50% { opacity: 1; r: 5; }
      }
      @keyframes floatTruck {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-4px); }
      }
      .beam-line {
        stroke-dasharray: 120 180;
        animation: pulseBeam 4s linear infinite;
      }
      .radar-arm {
        transform-origin: 1030px 160px;
        animation: radarSweep 6s linear infinite;
      }
      .node-pulse {
        animation: telemetryBlink 2.5s ease-in-out infinite;
      }
      .truck-icon {
        animation: floatTruck 3.5s ease-in-out infinite;
      }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-weight: 900;
        letter-spacing: -0.5px;
      }
      .sub-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-weight: 500;
        letter-spacing: 0.5px;
      }
      .badge-text {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-weight: 600;
        font-size: 11px;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" fill="url(#bgGrad)" rx="16" />
  <rect width="1200" height="320" fill="url(#grid)" rx="16" />

  <!-- Topographic Pit Contours (Mining Open Pit Terraces) -->
  <g opacity="0.25" stroke="#f59e0b" stroke-width="1.2" fill="none">
    <ellipse cx="1030" cy="160" rx="140" ry="110" />
    <ellipse cx="1030" cy="160" rx="105" ry="80" stroke-dasharray="6,4" />
    <ellipse cx="1030" cy="160" rx="70" ry="50" />
    <ellipse cx="1030" cy="160" rx="35" ry="25" stroke="#06b6d4" />
  </g>

  <!-- Telemetry / Dispatch Haul Routes Network -->
  <g fill="none" stroke-linecap="round">
    <!-- Static Road Map -->
    <path d="M 680,240 L 780,180 L 890,200 L 980,140 L 1030,160" stroke="#334155" stroke-width="3" />
    <path d="M 780,180 L 860,110 L 960,100 L 1030,160" stroke="#334155" stroke-width="3" />
    <path d="M 890,200 L 970,240 L 1070,210 L 1030,160" stroke="#334155" stroke-width="3" />

    <!-- Animated Dispatch Pulses -->
    <path d="M 680,240 L 780,180 L 890,200 L 980,140 L 1030,160" stroke="url(#goldGrad)" stroke-width="2.5" class="beam-line" filter="url(#glowSubtle)" />
    <path d="M 780,180 L 860,110 L 960,100 L 1030,160" stroke="url(#cyanGrad)" stroke-width="2.5" class="beam-line" style="animation-delay: -1.5s;" filter="url(#glowSubtle)" />
    <path d="M 890,200 L 970,240 L 1070,210 L 1030,160" stroke="#10b981" stroke-width="2.5" class="beam-line" style="animation-delay: -3s;" filter="url(#glowSubtle)" />
  </g>

  <!-- Mining Fleet Waypoints / GPS Sensor Nodes -->
  <g>
    <!-- Pit Center / Crusher / Dispatch Core -->
    <circle cx="1030" cy="160" r="12" fill="#0f172a" stroke="#06b6d4" stroke-width="2.5" filter="url(#glow)" />
    <circle cx="1030" cy="160" r="5" fill="#22d3ee" class="node-pulse" />

    <!-- Shovel Node 1 -->
    <circle cx="680" cy="240" r="8" fill="#0f172a" stroke="#f59e0b" stroke-width="2" />
    <circle cx="680" cy="240" r="3.5" fill="#fbbf24" class="node-pulse" style="animation-delay: -0.8s;" />

    <!-- Shovel Node 2 -->
    <circle cx="860" cy="110" r="8" fill="#0f172a" stroke="#f59e0b" stroke-width="2" />
    <circle cx="860" cy="110" r="3.5" fill="#fbbf24" class="node-pulse" style="animation-delay: -1.6s;" />

    <!-- Haul Truck Waypoint 1 -->
    <circle cx="780" cy="180" r="6" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5" />
    <circle cx="780" cy="180" r="2.5" fill="#38bdf8" />

    <!-- Haul Truck Waypoint 2 -->
    <circle cx="980" cy="140" r="6" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
    <circle cx="980" cy="140" r="2.5" fill="#34d399" />

    <!-- Dump Point -->
    <circle cx="970" cy="240" r="7" fill="#0f172a" stroke="#a855f7" stroke-width="2" />
    <circle cx="970" cy="240" r="3" fill="#c084fc" class="node-pulse" style="animation-delay: -2.1s;" />
  </g>

  <!-- Animated Radar Sweep in Dispatch Sector -->
  <g class="radar-arm" opacity="0.4">
    <line x1="1030" y1="160" x2="1170" y2="160" stroke="#06b6d4" stroke-width="2" filter="url(#glow)" />
    <path d="M 1030,160 L 1170,160 A 140 140 0 0 0 1150,90 Z" fill="url(#cyanGrad)" opacity="0.15" />
  </g>

  <!-- Heavy Mining Truck Stylized Silhouette -->
  <g class="truck-icon" transform="translate(920, 48)">
    <rect x="0" y="8" width="54" height="28" rx="4" fill="#f59e0b" opacity="0.9" />
    <!-- Canopy over Cab -->
    <polygon points="0,8 14,0 42,0 36,8" fill="#d97706" />
    <!-- Cab Glass -->
    <rect x="4" y="12" width="12" height="10" rx="2" fill="#0f172a" />
    <!-- Body Ribs -->
    <line x1="24" y1="11" x2="24" y2="33" stroke="#b45309" stroke-width="2" />
    <line x1="34" y1="11" x2="34" y2="33" stroke="#b45309" stroke-width="2" />
    <line x1="44" y1="11" x2="44" y2="33" stroke="#b45309" stroke-width="2" />
    <!-- Massive Heavy Hauler Wheels -->
    <circle cx="12" cy="38" r="10" fill="#1e293b" stroke="#475569" stroke-width="2" />
    <circle cx="12" cy="38" r="4" fill="#cbd5e1" />
    <circle cx="44" cy="38" r="10" fill="#1e293b" stroke="#475569" stroke-width="2" />
    <circle cx="44" cy="38" r="4" fill="#cbd5e1" />
  </g>

  <!-- Left Header Content -->
  <g transform="translate(60, 45)">
    <!-- Top Pill Tag -->
    <g transform="translate(0, 0)">
      <rect width="280" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="14" cy="13" r="4" fill="#10b981" class="node-pulse" />
      <text x="28" y="17" fill="#94a3b8" class="badge-text">AUTONOMOUS &amp; DISPATCH FMS</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="70" fill="#ffffff" font-size="34" class="title-text">
      Awesome Mining Fleet Management
    </text>

    <!-- Subtitle Line with Gold Highlight -->
    <text x="0" y="105" fill="url(#goldGrad)" font-size="19" font-weight="700" class="sub-text" filter="url(#glowSubtle)">
      Dispatch • Haulage Optimization • Equipment Telemetry • Autonomous Systems
    </text>

    <!-- Description -->
    <text x="0" y="138" fill="#94a3b8" font-size="14" class="sub-text">
      Curated ecosystem of enterprise SaaS solutions, open-source routing tools,
    </text>
    <text x="0" y="160" fill="#94a3b8" font-size="14" class="sub-text">
      telematics protocols, and production tracking frameworks for modern mines.
    </text>

    <!-- Feature Tag Chips -->
    <g transform="translate(0, 185)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="105" height="26" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1" />
      <text x="12" y="17" fill="#fbbf24" class="badge-text">⚡ DISPATCH</text>

      <!-- Tag 2 -->
      <rect x="115" y="0" width="115" height="26" rx="6" fill="#1e293b" stroke="#06b6d4" stroke-width="1" />
      <text x="127" y="17" fill="#38bdf8" class="badge-text">🛰️ TELEMATICS</text>

      <!-- Tag 3 -->
      <rect x="240" y="0" width="135" height="26" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1" />
      <text x="252" y="17" fill="#34d399" class="badge-text">🤖 AHS AUTONOMY</text>

      <!-- Tag 4 -->
      <rect x="385" y="0" width="125" height="26" rx="6" fill="#1e293b" stroke="#a855f7" stroke-width="1" />
      <text x="397" y="17" fill="#c084fc" class="badge-text">📊 VRP SOLVERS</text>
    </g>
  </g>

  <!-- Border Accent Lines -->
  <rect x="0" y="0" width="1200" height="320" rx="16" fill="none" stroke="#334155" stroke-width="1.5" />
  <line x1="30" y1="318" x2="300" y2="318" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />
  <line x1="900" y1="318" x2="1170" y2="318" stroke="url(#cyanGrad)" stroke-width="3" stroke-linecap="round" />
</svg>
